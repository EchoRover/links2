<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>linkeen admin</title>
  <script src="theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=32">
  <link rel="stylesheet" href="admin.css?v=4">
</head>
<body class="adm">
  <main class="adm-wrap">
    <header class="adm-head">
      <h1>linkeen admin</h1>
      <button type="button" id="logout" class="adm-link" hidden>log out</button>
    </header>

    <section id="login" hidden>
      <form id="login-form" class="adm-card">
        <label class="adm-label" for="pw">password</label>
        <div class="adm-row">
          <input id="pw" type="password" autocomplete="current-password" required>
          <button type="submit" class="adm-btn">enter</button>
        </div>
        <p id="login-err" class="adm-err" hidden></p>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="adm-card">
        <label class="adm-label" for="note">what changed?</label>
        <textarea id="note" rows="3" placeholder="plain words work: psych tomorrow cancelled, bio quiz next tue, Anandarup sir's lab moved to 2pm"></textarea>
        <p class="adm-mini">tap to add, no codes needed</p>
        <div id="pick" class="adm-chips adm-pick"></div>
        <div class="adm-row adm-tools">
          <button type="button" id="send" class="adm-btn">Send</button>
          <label class="adm-mini">brain
            <select id="brain">
              <option value="auto">auto</option>
              <option value="local">local</option>
              <option value="gemini">gemini</option>
            </select>
          </label>
          <label class="adm-mini" id="model-wrap" hidden>model
            <input id="model" type="text" value="qwen2.5:3b" spellcheck="false">
          </label>
        </div>
      </div>

      <div id="thread" class="adm-thread"></div>

      <div id="preview" class="adm-card" hidden>
        <p class="adm-label">preview</p>
        <p id="summary" class="adm-summary"></p>
        <ul id="preview-list" class="adm-ops"></ul>
        <label class="adm-mini adm-notify"><input type="checkbox" id="notify" checked> also push a notification to subscribers</label>
        <input id="notify-text" type="text" class="adm-notify-text" maxlength="200" placeholder="notification text (defaults to the summary)">
        <div class="adm-row">
          <button type="button" id="apply" class="adm-btn adm-primary">Apply all</button>
          <button type="button" id="discard" class="adm-btn">Discard</button>
        </div>
      </div>

      <div class="adm-card">
        <label class="adm-label" for="up-file">add a file to notes</label>
        <div class="adm-row">
          <select id="up-course" aria-label="Course"></select>
          <input id="up-file" type="file" multiple accept=".pdf,.pptx,.docx,.xlsx,.zip">
        </div>
        <div class="adm-row">
          <input id="up-name" type="text" placeholder="name (optional, one file only), e.g. Module 6 Lecture 1" style="flex:1;min-width:0">
          <button type="button" id="up-go" class="adm-btn adm-primary">Upload</button>
        </div>
        <div class="adm-row" id="up-token-row" hidden>
          <input id="up-token" type="password" placeholder="GitHub token (one time, stays in this browser)" style="flex:1;min-width:0" autocomplete="off">
          <button type="button" id="up-token-save" class="adm-btn">Save token</button>
        </div>
        <p class="adm-mini" id="up-token-set" hidden>GitHub token saved in this browser. <button type="button" id="up-token-forget" class="adm-link">forget it</button></p>
        <p id="up-status" hidden></p>
      </div>

      <p class="adm-label">live now</p>
      <ul id="live" class="adm-ops"></ul>
      <p id="status" class="adm-err" hidden></p>
    </section>
  </main>

  <script src="timetable.js?v=9"></script>
  <script src="admin-prompt.js?v=4"></script>
  <script src="admin.js?v=5"></script>
  <script src="admin-upload.js?v=1"></script>
</body>
</html>
