<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>linkeen · B.Tech Energy Engineering</title>
  <link rel="icon" type="image/png" href="sustainability.png">
  <script>
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <!-- games.css FIRST so styles.css overrides its #games-section positioning -->
  <link rel="stylesheet" href="games.css">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

  <!-- animated background layer -->
  <div id="bg" aria-hidden="true"></div>

  <!-- Games Modal Popup -->
  <div id="games-modal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="close-games-modal">&times;</span>
      <h2>Choose a Game</h2>
      <div id="game-choices">
        <button class="game-choice-btn" data-game="flappybird">Flappy Cell</button>
        <button class="game-choice-btn" data-game="snake">Snake</button>
        <button class="game-choice-btn" data-game="energypong">Energy Pong</button>
        <button class="game-choice-btn" data-game="gridgambit">Grid Gambit</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="main-content">
      <div class="container">

        <!-- Top bar -->
        <header class="topbar">
          <div class="brand">
            <div class="brand-text">linkeen<small>y3 · sem 5</small></div>
          </div>
          <div class="topbar-actions">
            <div id="games-section">
              <button id="open-games-modal" type="button">Games</button>
            </div>
            <a class="button" id="archive-btn" href="archive" aria-label="View past semesters" title="Past semesters">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="5" rx="1"></rect>
                <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path>
                <path d="M10 12h4"></path>
              </svg>
            </a>
            <button class="button" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
          </div>
        </header>

        <!-- Hero strip -->
        <section class="hero">
          <img src="image.png" alt="Avatar" class="avatar">
          <div class="hero-text">
            <p class="hero-eyebrow">Year 3 · Semester 5</p>
            <h1>B.Tech Energy Engineering</h1>
            <p class="hero-sub" id="hero-sub">y3 · running studies, links, updates &amp; the off-clock</p>
          </div>
          <div class="general"></div>
        </section>

        <!-- Body: left = courses + updates, right = reels -->
        <div class="body-grid">

          <div class="left-col">
            <div class="links"></div>

            <div class="updates-layout">
              <div class="updates">
                <h1>updates</h1>
                <div class="box" id="timetable-box"><h2>Timetable</h2></div>
                <div class="box" id="assignments-box"><h2>Assignments</h2></div>
                <div class="box" id="quizzes-box"><h2>Quizzes</h2></div>
              </div>
            </div>
          </div>

          <aside class="side-col">
            <div class="reel-panel left-reel">
              <div class="reel-frame">
                <video id="local-clip-left" playsinline autoplay muted loop></video>
              </div>
            </div>
            <div class="reel-panel right-reel">
              <div class="reel-frame">
                <video id="local-clip-right" playsinline autoplay muted loop></video>
              </div>
            </div>
          </aside>

        </div>

        <footer class="site-footer">
          <span class="footer-quote" id="footer-quote">linkeen · IITDA Energy</span>
          <span>2026 ✿</span>
        </footer>

      </div>
    </div>
  </div>

  <script src="shared.js?v=5"></script>
  <script src="scripts.js?v=5"></script>
  <script src="gamesscript.js"></script>

</body>
</html>
