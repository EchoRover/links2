<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EEN · YR 3 · IITD-AD · mid-sems</title>
  <link rel="icon" type="image/png" href="sustainability.png">
  <script>
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=19">
  <link rel="stylesheet" href="exam-mode.css?v=2">
  <script src="exam-mode.js?v=2"></script>
  <style>
    /* One row per paper, date on the left like the agenda cards on the home
       page. Kept to the site's cream/sage paper: this is a reading page, not
       a grid, so it does not need week.html's neutral ground. */
    .ex-intro { margin: 6px 0 14px; }
    .ex-intro h1 { font-family: var(--font-serif); font-weight: 500; font-size: 1.9rem; margin: 0; color: var(--text); }
    .ex-intro h1 em { font-family: 'Caveat', cursive; font-style: normal; color: var(--accent); font-size: 1.15em; margin-left: 4px; }
    .ex-intro p { margin: 4px 0 0; color: var(--text-muted); font-size: .92rem; }
    .ex-intro a { color: var(--accent-strong); }

    .ex-list { display: flex; flex-direction: column; gap: 8px; }
    .ex-list[hidden] { display: none; }  /* search hides the papers; display:flex would win over [hidden] */
    /* Each paper is a <details>: closed it is one line with a progress bar,
       so all five fit on a phone screen; only the next paper opens itself. */
    .ex-row {
      border-radius: 12px; background: var(--surface-elevated);
      border: 1px solid var(--border-soft); border-left: 4px solid var(--c);
    }
    .ex-row.done { opacity: .5; }
    .ex-row.today { box-shadow: 0 0 0 2px var(--c); }
    .ex-sum {
      display: grid; grid-template-columns: 52px minmax(0, 1fr) 18px; gap: 12px; align-items: center;
      padding: 10px 14px; cursor: pointer; list-style: none; user-select: none;
    }
    .ex-sum::-webkit-details-marker { display: none; }
    .ex-chev { color: var(--text-subtle); font-size: .9rem; transition: transform .2s ease; justify-self: end; }
    .ex-row[open] .ex-chev { transform: rotate(90deg); }

    .ex-date { text-align: center; line-height: 1.05; }
    .ex-date .dow, .ex-date .mon { font-size: .68rem; color: var(--text-subtle); }
    .ex-date .day { font-family: var(--font-serif); font-size: 1.6rem; color: var(--text); }

    .ex-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
    .ex-code { font-weight: 600; font-size: .78rem; color: var(--c); }
    .ex-name { font-family: var(--font-serif); font-size: 1.08rem; color: var(--text); }
    .ex-when { margin-left: auto; font-size: .8rem; color: var(--text-muted); white-space: nowrap; }
    .ex-prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: .76rem; color: var(--text-muted); }
    .ex-bar { flex: 1; height: 5px; border-radius: 99px; background: var(--border-soft); overflow: hidden; }
    .ex-bar i { display: block; height: 100%; background: var(--c); border-radius: inherit; transition: width .25s ease; }

    .ex-next {
      margin-top: 3px; font-size: .78rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ex-body { padding: 0 14px 12px; border-top: 1px dashed var(--border-soft); }
    .ex-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: .82rem; color: var(--text-muted); }
    .ex-meta b { color: var(--text); font-weight: 600; }
    .ex-early { color: var(--accent-warm); font-weight: 600; }
    .ex-meta a { color: var(--accent-strong); }
    .ex-reset {
      margin-left: auto; padding: 2px 10px; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: .76rem; color: var(--text-muted);
      background: none; border: 1px solid var(--border-soft);
    }
    .ex-reset[data-armed] { color: var(--accent-warm); border-color: var(--accent-warm); }

    .ex-topics { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 2px 18px; }
    @media (min-width: 760px) { .ex-topics { grid-template-columns: 1fr 1fr; } }
    .ex-topics label { display: flex; align-items: flex-start; gap: 8px; font-size: .88rem; color: var(--text); cursor: pointer; }
    .ex-topics input { accent-color: var(--c); margin-top: 3px; flex: none; }
    .ex-topics input:checked + span { color: var(--text-subtle); text-decoration: line-through; }
    /* The link sits outside the label so tapping it never ticks the box,
       and it is a 40px chip because a bare ↗ was too small to hit. */
    .ex-topics li { display: flex; align-items: center; gap: 8px; }
    .ex-topics li label { flex: 1; min-width: 0; padding: 3px 0; }
    .ex-open {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 30px; border-radius: 999px; font-size: .9rem; text-decoration: none;
      color: var(--accent-strong); border: 1px solid var(--border-soft); background: var(--surface);
    }
    .ex-open:hover { border-color: var(--c); color: var(--text); }
    .ex-none { margin-top: 6px; font-size: .85rem; color: var(--text-subtle); font-style: italic; }
    .ex-note { margin-top: 6px; font-size: .84rem; color: var(--text-muted); }

    /* Slide search: one box, results replace the paper list while typing. */
    .ss-box { margin: 0 0 12px; }
    .ss-box input {
      width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px;
      font: inherit; font-size: .95rem; color: var(--text);
      background: var(--surface-elevated); border: 1px solid var(--border-soft);
      outline: none;
    }
    .ss-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .ss-results { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .ss-results:empty { display: none; }
    .ss-count, .ss-empty { font-size: .84rem; color: var(--text-muted); }
    .ss-empty { font-style: italic; }
    .ss-dym { font-size: .9rem; color: var(--text-muted); line-height: 1.5; }
    .ss-fix { color: var(--accent); }
    .ss-link { background: none; border: 0; padding: 0; font: inherit; color: var(--text-muted); text-decoration: underline; cursor: pointer; }
    .ss-link:hover { color: var(--text); }
    .ss-hit {
      display: block; padding: 10px 14px; border-radius: 12px; text-decoration: none;
      background: var(--surface-elevated); border: 1px solid var(--border-soft);
      border-left: 4px solid var(--c);
    }
    .ss-hit:hover, .ss-hit.ss-active { border-color: var(--c); }
    .ss-hit.ss-active { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
    .ss-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ss-chip {
      font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
      padding: 4px 10px; border-radius: 999px; color: var(--c, var(--text-muted));
      background: var(--surface-elevated); border: 1px solid var(--border-soft);
    }
    .ss-chip:hover { border-color: var(--c, var(--accent)); }
    .ss-chip[aria-pressed="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--surface); }
    .ss-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
    .ss-code { font-weight: 600; font-size: .78rem; color: var(--c); }
    .ss-title { font-family: var(--font-serif); font-size: 1rem; color: var(--text); }
    .ss-page { margin-left: auto; font-size: .78rem; color: var(--text-subtle); white-space: nowrap; }
    .ss-snip { margin-top: 3px; font-size: .84rem; line-height: 1.45; color: var(--text-muted); overflow-wrap: anywhere; }
    .ss-snip mark { background: color-mix(in srgb, var(--c) 28%, transparent); color: var(--text); border-radius: 3px; padding: 0 2px; }

    @media (max-width: 560px) {
      .ex-sum { grid-template-columns: 40px minmax(0, 1fr) 14px; gap: 10px; padding: 9px 12px; }
      .ex-next {
      margin-top: 3px; font-size: .78rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ex-body { padding: 0 12px 10px; }
      .ex-date .day { font-size: 1.35rem; }
      .ex-intro h1 { font-size: 1.5rem; }
      .ex-intro h1 em { white-space: nowrap; }
      /* code and countdown share line one, the name gets its own line */
      .ex-name { order: 3; width: 100%; font-size: 1rem; }
    }
  </style>
</head>
<body class="archive-page">

  <!-- animated background layer -->
  <div id="bg" aria-hidden="true"></div>

  <div class="layout">
    <div class="main-content">
      <div class="container">

        <header class="topbar">
          <div class="brand">
            <a class="brand-text" href="/">← linkeen<small>mid-sems</small></a>
          </div>
          <div class="topbar-actions">
            <button class="button" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
          </div>
        </header>

        <section class="ex-intro">
          <h1>Mid-sem portions <em>24–29 Oct</em></h1>
          <p>Year 3 EEN papers, in order. Tap a paper to open its checklist. Ticks stay on this device only.</p>
        </section>

        <div class="ss-box">
          <input id="ss-input" type="search" placeholder="Search every slide: meiosis, ybus, abductive, operant… (typos are fine)" autocomplete="off" spellcheck="false" aria-label="Search slides">
        </div>
        <div class="ss-results" id="ss-results" aria-live="polite"></div>

        <div class="ex-list" id="ex-list"></div>

        <footer class="site-footer">
          <span class="footer-quote" id="footer-quote">linkeen · mid-sems</span>
          <span>2026 ✿</span>
        </footer>

      </div>
    </div>
  </div>

  <script src="shared.js?v=17"></script>
  <script src="exams.js?v=9"></script>
  <script src="slide-search.js?v=3"></script>

</body>
</html>
