name: check
# Drift guard: fails the push if the timetable/holiday copies disagree (tools/check_data.mjs).
on:
  push:
    branches: [main]
    paths: [timetable.js, scripts.js, common.js, free.html, tools/check_data.mjs]
  workflow_dispatch:

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check_data.mjs
