name: notify
# Instant run on content push or manual broadcast. The every-minute scheduler is notify-loop.yml.
on:
  push:
    branches: [main]
    paths: [announce.js, scripts.js]
  workflow_dispatch:
    inputs:
      title: { description: "Broadcast title (empty = just run the scheduler)", required: false }
      body: { description: "Broadcast text", required: false }
      url: { description: "Page to open, e.g. /bus", required: false, default: "/" }

concurrency: { group: notify, cancel-in-progress: false }

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "tools\nannounce.js\nscripts.js\ntimetable.js", sparse-checkout-cone-mode: false }
      - run: node tools/notify.mjs
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          NOTIFY_TITLE: ${{ inputs.title }}
          NOTIFY_BODY: ${{ inputs.body }}
          NOTIFY_URL: ${{ inputs.url }}
